name: Download Offline Assets for K8s

on:
  workflow_dispatch:
    inputs:
      metrics_server_version:
        description: 'Metrics-Server Helm Chart Version'
        required: true
        default: 'v3.12.1' # 请根据需要调整版本
      ingress_nginx_version:
        description: 'Ingress-Nginx Helm Chart Version'
        required: true
        default: '4.10.0' # 请根据需要调整版本

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create output directory
        run: mkdir -p offline-assets/charts offline-assets/images

      # ==========================================
      # 1. 处理 Metrics-Server
      # ==========================================
      - name: Download Metrics-Server Chart & Images
        run: |
          echo "=== Processing Metrics-Server ==="
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          
          # 下载 Helm Chart
          helm pull metrics-server/metrics-server --version ${{ inputs.metrics_server_version }} -d offline-assets/charts/
          
          # 获取镜像列表
          helm template metrics-server metrics-server/metrics-server --version ${{ inputs.metrics_server_version }} | grep "image:" | awk '{print $2}' | tr -d '"' | sort -u > metrics-server-images.txt
          echo "Metrics-Server Images to pull:"
          cat metrics-server-images.txt

          # 拉取镜像并保存
          while read -r img; do
            if [ -n "$img" ]; then
              echo "Pulling $img..."
              docker pull "$img"
              safe_name=$(echo "$img" | tr '/' '_' | tr ':' '_')
              docker save "$img" -o "offline-assets/images/${safe_name}.tar"
            fi
          done < metrics-server-images.txt

      # ==========================================
      # 2. 处理 Ingress-Nginx
      # ==========================================
      - name: Download Ingress-Nginx Chart & Images
        run: |
          echo "=== Processing Ingress-Nginx ==="
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          
          # 下载 Helm Chart
          helm pull ingress-nginx/ingress-nginx --version ${{ inputs.ingress_nginx_version }} -d offline-assets/charts/
          
          # 获取镜像列表
          helm template ingress-nginx ingress-nginx/ingress-nginx --version ${{ inputs.ingress_nginx_version }} | grep "image:" | awk '{print $2}' | tr -d '"' | sort -u > ingress-nginx-images.txt
          echo "Ingress-Nginx Images to pull:"
          cat ingress-nginx-images.txt

          # 拉取镜像并保存
          while read -r img; do
            if [ -n "$img" ]; then
              echo "Pulling $img..."
              docker pull "$img"
              safe_name=$(echo "$img" | tr '/' '_' | tr ':' '_')
              docker save "$img" -o "offline-assets/images/${safe_name}.tar"
            fi
          done < ingress-nginx-images.txt

      # ==========================================
      # 3. 打包所有资源
      # ==========================================
      - name: Compress Offline Assets
        run: |
          tar -czvf k8s-offline-assets.tar.gz -C offline-assets .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-offline-assets
          path: k8s-offline-assets.tar.gz
