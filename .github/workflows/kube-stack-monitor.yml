name: Export Kube-Prometheus-Stack Images for K8s 1.33

on:
  workflow_dispatch:
    inputs:
      helm_version:
        description: 'Kube-Prometheus-Stack Helm Chart Version'
        required: true
        default: '88.5.2'
        type: string

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Add Helm Repository & Template Chart
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          # 关键修改：加上 --kube-version 1.33.1 绕过本地环境集群版本限制
          helm template monitoring-release prometheus-community/kube-prometheus-stack \
            --version ${{ inputs.helm_version }} \
            --kube-version 1.33.1 > release-manifests.yaml

      - name: Extract Image List
        id: extract-images
        run: |
          echo "Extracting images from Kubernetes manifests..."
          grep -h "image:" release-manifests.yaml | awk '{print $2}' | tr -d '"' | tr -d "'" | sed 's/^ *//;s/ *$//' | sort -u > images.txt
          
          echo "=== Found the following images ==="
          cat images.txt

      - name: Pull and Save Images to Tar
        run: |
          mkdir -p offline-images
          while IFS= read -r image; do
            if [ -n "$image" ]; then
              echo "----------------------------------------"
              echo "Pulling image: $image"
              docker pull "$image" || echo "Warning: Failed to pull $image, please check if the image tag is valid."
              
              safe_name=$(echo "$image" | tr '/' '_' | tr ':' '_')
              echo "Saving image to offline-images/${safe_name}.tar"
              docker save "$image" -o "offline-images/${safe_name}.tar" || true
            fi
          done < images.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-prometheus-stack-images-${{ inputs.helm_version }}
          path: offline-images/*.tar
