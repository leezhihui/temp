name: Download Vaultwarden Resources

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 0 * * 1' # 默认每周一自动检查一次最新版

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Vaultwarden Release Info
        id: fetch_release
        uses: pozetroninc/github-action-get-latest-release@v8
        with:
          repository: dani-garcia/vaultwarden
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Source Code and Web-Vault Assets
        run: |
          TAG="${{ steps.fetch_release.outputs.releaseTag }}"
          echo "Latest Vaultwarden version is: $TAG"
          
          mkdir -p vaultwarden-resources
          
          # 1. 下载 Vaultwarden 官方 Release 源码压缩包
          echo "Downloading source code..."
          curl -L -o vaultwarden-resources/source-${TAG}.tar.gz \
            "https://github.com/dani-garcia/vaultwarden/archive/refs/tags/${TAG}.tar.gz"

          # 2. 如果你需要独立的 Web 静态资源（web-vault），可以顺便把官方前端项目一起拉取
          # Vaultwarden 的 Web 前端通常来自 3rd-party 的 web-vault 编译版
          echo "Downloading web-vault latest release..."
          WEB_VAULT_TAG=$(curl -s https://api.github.com/repos/dani-garcia/bw_web_builds/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest web-vault version is: $WEB_VAULT_TAG"
          
          curl -L -o vaultwarden-resources/web-vault-${WEB_VAULT_TAG}.tar.gz \
            "https://github.com/dani-garcia/bw_web_builds/archive/refs/tags/${WEB_VAULT_TAG}.tar.gz"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-offline-packages
          path: vaultwarden-resources/
