name: Export Vaultwarden Docker Image and Resources

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  export-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Vaultwarden Official Image
        run: |
          docker pull vaultwarden/server:latest

      - name: Save Docker Image to Tar Archive
        run: |
          mkdir -p vaultwarden-offline
          docker save vaultwarden/server:latest -o vaultwarden-offline/vaultwarden-server.tar

      - name: Generate Sample Docker Compose File
        run: |
          cat << 'EOF' > vaultwarden-offline/docker-compose.yml
          version: '3.8'

          services:
            vaultwarden:
              image: vaultwarden/server:latest
              container_name: vaultwarden
              restart: unless-stopped
              network_mode: "host"
              environment:
                - SIGNUPS_ALLOWED=true
              volumes:
                - ./vw-data:/data
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-docker-offline-package
          path: vaultwarden-offline/
