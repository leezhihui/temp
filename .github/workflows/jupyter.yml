name: Download Jupyter Scipy-Notebook Image

on:
  workflow_dispatch: # 支持手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Jupyter Scipy-Notebook Image
        run: |
          # 定义需要拉取的 Jupyter 镜像（如果需要其他相关镜像，可以在这里继续添加）
          IMAGES=(
            "jupyter/scipy-notebook:latest"
          )

          echo "开始拉取 Jupyter Scipy-Notebook 镜像..."
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img"
            docker pull "$img"
          done

          echo "正在将镜像打包并压缩..."
          docker save "${IMAGES[@]}" | gzip > jupyter-scipy-notebook.tar.gz
          
          echo "打包完成！最终离线包大小（经过gzip压缩）："
          du -sh jupyter-scipy-notebook.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-scipy-notebook-package
          path: jupyter-scipy-notebook.tar.gz
          retention-days: 2 # 预留2天供下载
