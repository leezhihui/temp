name: Pack RagFlow 0.25.6 Node Modules for Offline

on:
  workflow_dispatch: # 支持手动触发运行

jobs:
  build-and-pack:
    runs-on: ubuntu-latest # 使用 Linux 64位环境

    steps:
      # 1. 检出指定版本的 RagFlow 源码
      - name: Checkout RagFlow v0.25.6
        uses: actions/checkout@v4
        with:
          repository: 'infiniflow/ragflow'
          ref: 'v0.25.6' # 锁定 0.25.6 版本

      # 2. 安装并配置 Node.js v24
      - name: Setup Node.js v24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 自动匹配 v24 版本的 Linux 64 位环境

      # 3. 验证环境（可选，方便排查问题）
      - name: Check Environment
        run: |
          node -v
          npm -v
          echo "Current directory structure:"
          ls -la

      # 4. 安装 Node 依赖包
      # 注意：RagFlow 的前端代码通常在类似 web/ 目录下，脚本中会先切入该目录
      - name: Install Dependencies
        run: |
          # 如果 RagFlow 的 package.json 在根目录，直接执行 npm install
          # 如果在 web 子目录，请取消下面两行的注释：
          # cd web
          npm install

      # 5. 将 node_modules 打包压缩
      - name: Tar node_modules
        run: |
          # 如果上面切换了目录，这里也需要同步 cd web
          # cd web
          tar -zcvf ragflow-node-modules.tar.gz node_modules/

      # 6. 将打包好的压缩包上传到 GitHub Actions Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragflow-offline-modules
          path: |
            ragflow-node-modules.tar.gz
          retention-days: 7 # 在 GitHub 上保留 7 天
