name: Download DCGM Offline Assets

on:
  workflow_dispatch:
    inputs:
      dcgm_version:
        description: 'DCGM-Exporter 镜像版本标签'
        required: true
        default: '4.6.0-4.8.3-distroless'

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p offline-bundle

      - name: Clone DCGM-Exporter Repository for Helm Chart
        run: |
          # 直接克隆官方源码，其 deployment 目录本身就是一个标准的 Helm Chart
          git clone --depth 1 https://github.com/NVIDIA/dcgm-exporter.git temp-dcgm
          cp -r temp-dcgm/deployment offline-bundle/dcgm-chart

      - name: Pull and Save Docker Image
        run: |
          IMAGE="nvcr.io/nvidia/k8s/dcgm-exporter:${{ inputs.dcgm_version }}"
          echo "Pulling image: $IMAGE"
          docker pull $IMAGE
          docker save $IMAGE -o offline-bundle/dcgm-exporter-image.tar

      - name: Compress Bundle
        run: |
          tar -czvf dcgm-offline-bundle.tar.gz -C offline-bundle .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcgm-offline-bundle
          path: dcgm-offline-bundle.tar.gz
