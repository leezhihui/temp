name: Download DCGM Offline Assets

on:
  workflow_dispatch:
    inputs:
      dcgm_version:
        description: 'DCGM-Exporter 镜像版本标签'
        required: true
        default: '4.6.0-4.8.3-distroless'

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p offline-bundle

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Download Helm Chart
        run: |
          helm repo add gpu-helm-charts https://nvidia.github.io/dcgm-charts
          helm repo update
          helm pull gpu-helm-charts/dcgm-exporter --destination offline-bundle/

      - name: Pull and Save Docker Image
        run: |
          IMAGE="nvcr.io/nvidia/k8s/dcgm-exporter:${{ inputs.dcgm_version }}"
          echo "Pulling image: $IMAGE"
          docker pull $IMAGE
          docker save $IMAGE -o offline-bundle/dcgm-exporter-image.tar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcgm-offline-bundle
          path: offline-bundle/
