name: Download Kube-Prometheus-Stack Helm Chart & CRDs

on:
  workflow_dispatch:
    inputs:
      helm_version:
        description: 'Kube-Prometheus-Stack Helm Chart Version'
        required: true
        default: '88.5.2'
        type: string

jobs:
  download-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Pull Helm Chart & Extract CRDs
        run: |
          # 添加仓库并更新
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          mkdir -p offline-chart offline-crds
          
          # 1. 下载指定版本的 Helm Chart (.tgz)
          helm pull prometheus-community/kube-prometheus-stack --version ${{ inputs.helm_version }} --destination offline-chart/
          
          # 2. 解压 Chart
          tar -zxvf offline-chart/kube-prometheus-stack-${{ inputs.helm_version }}.tgz -C offline-chart/
          
          # 3. 直接通过 helm template 导出该版本专属的全部 CRD 到离线目录中
          helm template monitoring-release offline-chart/kube-prometheus-stack \
            --include-crds \
            --kube-version 1.33.1 > all-with-crds.yaml
            
          # 使用awk或split把CRD部分单独切分出来（kube-prometheus-stack 的 CRD 通常带有 Kind: CustomResourceDefinition）
          # 这里为了简单稳妥，我们直接利用刚才看到的实际路径复制目录
          if [ -d "offline-chart/kube-prometheus-stack/charts/crds/crds" ]; then
            cp -r offline-chart/kube-prometheus-stack/charts/crds/crds/* ./offline-crds/
          else
            echo "Fallback: extracting crds from template..."
            # 如果目录结构特殊，直接将整个 crds 子图表目录内容拷贝
            cp -r offline-chart/kube-prometheus-stack/charts/crds/* ./offline-crds/
          fi

      - name: Archive CRDs and Chart
        run: |
          # 把解压后的整个 chart 目录打包成 zip
          cd offline-chart
          zip -r ../kube-prometheus-stack-${{ inputs.helm_version }}-source.zip kube-prometheus-stack/
          cd ..
          
          # 把 crds 打包
          zip -r offline-crds.zip offline-crds/

      - name: Upload Chart & CRDs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-prometheus-stack-chart-and-crds-${{ inputs.helm_version }}
          path: |
            offline-chart/*.tgz
            offline-chart/kube-prometheus-stack-*-source.zip
            offline-crds.zip
