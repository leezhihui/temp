name: Download Kube-Prometheus-Stack Helm Chart

on:
  workflow_dispatch:
    inputs:
      helm_version:
        description: 'Kube-Prometheus-Stack Helm Chart Version'
        required: true
        default: '88.5.2'
        type: string

jobs:
  download-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Pull Helm Chart
        run: |
          # 添加仓库并更新
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          # 创建输出目录
          mkdir -p offline-chart
          
          # 下载指定版本的 Helm Chart (.tgz)
          helm pull prometheus-community/kube-prometheus-stack --version ${{ inputs.helm_version }} --destination offline-chart/
          
          # 同时解压一份，方便单独提取里面的 crds 目录
          tar -zxvf offline-chart/kube-prometheus-stack-${{ inputs.helm_version }}.tgz -C offline-chart/
          
          # 将关键的 crds 目录单独复制一份到根目录，方便离线直接 apply
          cp -r offline-chart/kube-prometheus-stack/charts/prometheus-operator/crds ./offline-crds

      - name: Archive CRDs and Chart
        run: |
          # 把解压后的整个 chart 目录也重新打包成 zip，方便直接离线 helm install
          cd offline-chart
          zip -r ../kube-prometheus-stack-${{ inputs.helm_version }}-source.zip kube-prometheus-stack/
          cd ..
          
          # 把 crds 也打包
          zip -r offline-crds.zip offline-crds/

      - name: Upload Chart & CRDs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-prometheus-stack-chart-and-crds-${{ inputs.helm_version }}
          path: |
            offline-chart/*.tgz
            offline-chart/kube-prometheus-stack-*-source.zip
            offline-crds.zip
